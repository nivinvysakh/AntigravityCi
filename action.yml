name: "AntigravityCI"
description: "AI PR assistant powered by embedded local Qwen2.5-Coder (zero API keys needed) with optional Google Gemini / Cloud fallback."
author: "Antigravity Team"
branding:
  icon: "cpu"
  color: "purple"

inputs:
  engine:
    description: "AI Engine: 'auto' (defaults to Cloud if key provided, else Local), 'local' (offline Qwen2.5-Coder), or 'gemini'"
    required: false
    default: "auto"
  gemini_api_key:
    description: "Optional Google Gemini API Key. If not provided, runs 100% locally with embedded Qwen2.5-Coder."
    required: false
    default: ""
  github_token:
    description: "GitHub Token for API operations (creating reactions, branches, comments, PRs)"
    required: false
    default: "${{ github.token }}"
  model:
    description: "Gemini Model name to use when running in cloud mode (with automatic cascade fallback)"
    required: false
    default: "gemini-3.6-flash"
  bot_name:
    description: "Trigger handle for the bot in comments"
    required: false
    default: "@antigravityci"
  post_ack:
    description: "Whether to post the initial instruction replay comment (set false if handled by fast acknowledge job)"
    required: false
    default: "true"
  max_file_size_kb:
    description: "Maximum file size in KB to send to the model context (safety filter)"
    required: false
    default: "50"
  target_branch:
    description: "Target branch for newly generated PRs ('auto' targets original PR base)"
    required: false
    default: "auto"

runs:
  using: "docker"
  image: "Dockerfile"
  env:
    INPUT_ENGINE: ${{ inputs.engine }}
    GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
    INPUT_MODEL: ${{ inputs.model }}
    INPUT_BOT_NAME: ${{ inputs.bot_name }}
    INPUT_POST_ACK: ${{ inputs.post_ack }}
    INPUT_MAX_FILE_SIZE_KB: ${{ inputs.max_file_size_kb }}
    INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
