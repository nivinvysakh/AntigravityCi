name: CI Test Suite

on:
  push:
    branches: [main, feature/rewrite-js, beta, test]
  pull_request:
    branches: [main, feature/rewrite-js, beta, test]

jobs:
  test:
    name: Run Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Suite
        run: npm test

      - name: Verify Distribution Build
        run: npm run build
